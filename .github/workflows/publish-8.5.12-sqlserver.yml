name: Publicar imagem 8.5.12-sqlserver

on:
  pull_request:
    paths:
      - '8.5.12-sqlserver/**'
      - '.github/workflows/publish-8.5.12-sqlserver.yml'
  push:
    branches: [main]
    paths:
      - '8.5.12-sqlserver/**'
      - '.github/workflows/publish-8.5.12-sqlserver.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clubenaval/php

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Só faz login e publica fora de pull requests
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push, fora de pull requests)
        uses: docker/build-push-action@v6
        with:
          context: ./8.5.12-sqlserver
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:8.5.12-sqlserver
          labels: |
            org.opencontainers.image.source=https://github.com/clubenaval/php
            org.opencontainers.image.description=PHP 8.5.12 + Apache com extensões comuns e drivers SQL Server (sqlsrv/pdo_sqlsrv) e MySQL
          cache-from: type=gha
          cache-to: type=gha,mode=max
